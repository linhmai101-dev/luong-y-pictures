# Tạo kho ảnh lưỡi trên máy chủ GitHub – không cần cài gì trên máy tính.
# Vào tab Actions → "Tạo kho ảnh lưỡi" → Run workflow.
name: Tạo kho ảnh lưỡi

on:
  workflow_dispatch:
    inputs:
      nguon:
        description: "Lấy bộ dữ liệu từ đâu (kho-luu-tru = bản đã cất trong mục Releases của repo; lần đầu chọn google-drive)"
        type: choice
        options: ["kho-luu-tru", "google-drive", "dryad"]
        default: "kho-luu-tru"
      drive_id:
        description: "Nếu chọn google-drive: dán mã file hoặc cả link chia sẻ của file"
        required: false
        default: ""
      chi_tiet:
        description: "Mã ảnh cần bản phóng to (12 ký tự, cách nhau bằng dấu cách). Để trống khi tạo kho lần đầu."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: kho-anh
  cancel-in-progress: false

jobs:
  tao:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CHI_TIET: ${{ inputs.chi_tiet }}
      NGUON: ${{ inputs.nguon }}
      DRIVE_ID: ${{ inputs.drive_id }}
      MIN_SIZE: "2000000000"
      GH_TOKEN: ${{ github.token }}
      BAN_LUU: du-lieu-goc
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Kiểm tra mã ảnh nhập vào
        if: ${{ inputs.chi_tiet != '' }}
        run: |
          for m in $CHI_TIET; do
            [[ "$m" =~ ^[0-9a-f]{12}$ ]] || { echo "Mã không hợp lệ: $m (mỗi mã gồm 12 ký tự 0-9, a-f)"; exit 1; }
          done
          [ -f danh-muc.json ] || { echo "Chưa có danh-muc.json – hãy chạy tạo kho lần đầu (để trống ô mã ảnh)."; exit 1; }

      - name: Cài thư viện
        run: pip install pillow

      - name: Tải bộ dữ liệu (2,3 GB)
        run: |
          UA="luong-y-pictures/1.0 (GitHub Actions; hoc tap ca nhan; lien he qua github.com/linhmai101-dev)"
          tai() { curl -L --retry 3 --retry-delay 15 -A "$UA" -o ds.zip -w "%{http_code}" "$1"; }
          if [ "$NGUON" = "kho-luu-tru" ]; then
            if ! gh release view "$BAN_LUU" > /dev/null 2>&1; then
              echo "::error::Chưa có bản lưu trữ trong mục Releases. Chạy một lần với nguồn google-drive; workflow sẽ tự cất bản lưu trữ."; exit 1
            fi
            gh release download "$BAN_LUU" --pattern "phan-*" --pattern "sha256-ban-goc.txt" --dir luu --clobber
            cat luu/phan-* > ds.zip
            # đối chiếu mã kiểm tra: bảo đảm ghép đủ, đúng bản gốc
            (cd luu && awk '{print $1"  ../ds.zip"}' sha256-ban-goc.txt | sha256sum -c -) || { echo "::error::Bản lưu trữ ghép lại không khớp mã kiểm tra."; exit 1; }
            cp luu/sha256-ban-goc.txt ./sha256-ban-goc.txt; rm -rf luu
          elif [ "$NGUON" = "google-drive" ]; then
            # chấp nhận cả link lẫn mã; bỏ khoảng trắng, xuống dòng thừa
            ID=$(printf '%s' "$DRIVE_ID" | tr -d '[:space:]')
            if [[ "$ID" =~ /d/([A-Za-z0-9_-]+) ]]; then ID="${BASH_REMATCH[1]}"; fi
            if [[ "$ID" =~ [?\&]id=([A-Za-z0-9_-]+) ]]; then ID="${BASH_REMATCH[1]}"; fi
            [[ "$ID" =~ ^[A-Za-z0-9_-]{20,}$ ]] || { echo "::error::Mã file Drive không hợp lệ: '$DRIVE_ID'"; exit 1; }
            echo "Mã file Drive: $ID"
            # cách 1: tải thẳng từ máy chủ tải xuống của Google Drive (bỏ qua trang cảnh báo file lớn)
            CODE=$(tai "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t" || true)
            echo "Cách 1 – mã phản hồi: $CODE, kích thước: $(stat -c%s ds.zip 2>/dev/null || echo 0)"
            if [ "$(stat -c%s ds.zip 2>/dev/null || echo 0)" -lt "$MIN_SIZE" ]; then
              (head -c 600 ds.zip 2>/dev/null | tr -cd '[:print:]\n' | head -20) || true; echo
              echo "Cách 1 không được, thử cách 2 (gdown)…"
              rm -f ds.zip
              pip install -q gdown
              gdown --fuzzy "https://drive.google.com/file/d/$ID/view" -O ds.zip 2>&1 | tail -5 || true
            fi
            if [ "$(stat -c%s ds.zip 2>/dev/null || echo 0)" -lt "$MIN_SIZE" ]; then
              echo "::error::Không tải được từ Google Drive. Kiểm tra: file đã tải lên xong chưa, đã chia sẻ 'Bất kỳ ai có đường liên kết' chưa; nếu Drive báo quá nhiều lượt tải thì đợi vài giờ rồi chạy lại."
              exit 1
            fi
          else
            for URL in "https://datadryad.org/api/v2/files/4540656/download" "https://datadryad.org/downloads/file_stream/4540656"; do
              echo "Thử: $URL"; CODE=$(tai "$URL" || true); echo "Mã phản hồi: $CODE"
              SIZE=$(stat -c%s ds.zip 2>/dev/null || echo 0)
              if [ "$SIZE" -ge "$MIN_SIZE" ]; then break; fi
            done
          fi
          SIZE=$(stat -c%s ds.zip 2>/dev/null || echo 0)
          echo "Kích thước: $SIZE byte"
          if [ "$SIZE" -lt "$MIN_SIZE" ]; then
            echo "::error::Không tải được bộ dữ liệu ($SIZE byte). Nếu nguồn là Dryad: Dryad chặn tải tự động – hãy chạy lại với nguồn google-drive."
            exit 1
          fi
          [ "$NGUON" = "kho-luu-tru" ] || sha256sum ds.zip | tee sha256-ban-goc.txt
          # lần đầu tải thành công: cất bản gốc vào Releases (chia phần dưới 2 GB theo giới hạn của GitHub)
          if [ "$NGUON" != "kho-luu-tru" ] && ! gh release view "$BAN_LUU" > /dev/null 2>&1; then
            split -b 1900m -d -a 2 ds.zip phan-
            gh release create "$BAN_LUU" phan-* sha256-ban-goc.txt \
              --title "Dữ liệu gốc TCM-Tongue (Dryad 10.5061/dryad.1c59zw48r)" \
              --notes "Bản lưu trữ để workflow dùng lại, không phải tải lại từ Drive. Ghép: cat phan-* > shezhen_datasets1.zip, rồi đối chiếu sha256-ban-goc.txt."
            rm -f phan-*
            echo "Đã cất bản lưu trữ vào Releases/$BAN_LUU"
          fi

      - name: Giải nén
        run: |
          unzip -q ds.zip -d _nguon || { echo "::error::File zip bị hỏng hoặc tải chưa hết."; exit 1; }
          rm ds.zip
          # nếu bên trong còn file zip con (coco / txt / xml) thì giải nén tiếp
          find _nguon -type f -name "*.zip" | while IFS= read -r z; do
            echo "Giải nén tiếp: $z"; unzip -q "$z" -d "${z%.zip}" && rm "$z"
          done
          du -sh _nguon

      - name: Tạo kho ảnh (lần đầu)
        if: ${{ inputs.chi_tiet == '' }}
        run: |
          python xu-ly-kho-anh.py tao _nguon kho
          rm -f kho/goc-duong-dan.txt
          # chặn trước khi lưu: GitHub Pages giới hạn khoảng 1 GB cho mỗi trang
          TONG=$(du -sb kho | cut -f1); echo "Dung lượng kho mới: $((TONG/1000000)) MB"
          if [ "$TONG" -gt 950000000 ]; then
            echo "::error::Kho ảnh vượt 950 MB ($((TONG/1000000)) MB). Giảm CANH_LUOI hoặc CL_LUOI trong xu-ly-kho-anh.py rồi chạy lại."; exit 1
          fi
          # thay toàn bộ kết quả cũ bằng kết quả mới (mọi thư mục và tệp công cụ tạo ra)
          for d in anh luoi goc; do rm -rf "$d"; if [ -d "kho/$d" ]; then mv "kho/$d" "./$d"; fi; done
          for f in danh-muc.json danh-muc-app.json bao-cao.txt; do if [ -f "kho/$f" ]; then mv -f "kho/$f" ./; fi; done
          ls kho   # phải trống – nếu còn gì là công cụ đã tạo thêm tệp mà workflow chưa chuyển
          [ -z "$(ls -A kho)" ] || { echo "::error::Còn tệp chưa được chuyển khỏi thư mục tạm: $(ls -A kho)"; exit 1; }
          touch .nojekyll

      - name: Tạo bản phóng to theo mã
        if: ${{ inputs.chi_tiet != '' }}
        run: python xu-ly-kho-anh.py chitiet . _nguon $CHI_TIET

      - name: Lưu vào repo
        run: |
          rm -rf _nguon kho
          git config user.name "kho-anh-bot"
          git config user.email "kho-anh-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Không có thay đổi"; exit 0; fi
          git commit -q -m "Cập nhật kho ảnh lưỡi"
          git pull --rebase -q || true
          git push
